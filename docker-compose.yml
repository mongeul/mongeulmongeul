version: '3.8'

services:
  mongeulmongeul-spring:
    container_name: mongeulmongeul-spring
    image: mongeulmongeul-spring
    build:
      context: mongeul/
      dockerfile: Dockerfile
      args:
        PLATFORM: linux/arm64
    environment:
      - TZ=Asia/Seoul
    privileged: true
    networks:
      - mongeulmongeul-network

networks:
  mongeulmongeul-network:
    external: true
